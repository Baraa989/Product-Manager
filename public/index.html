<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Manager</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Yttre ram som motsvarar skissen -->
  <div class="wireframe-container">
    
    <!-- Topplist med Product Manager -->
    <header class="top-bar">
      <span>Product Manager</span>
    </header>

    <!-- Huvudinnehåll -->
    <main class="content-area">
      <h1 class="main-title">Produktadministration</h1>

      <!-- Felmeddelande-ruta om något API-anrop misslyckas -->
      <div id="error-message" class="error-box" style="display: none;"></div>

      <!-- Formulär för att lägga till ny produkt -->
      <!-- HTML:s inbyggda formulärvalidering används med required och min="0.01" -->
      <form id="product-form">
        
        <!-- Rad 1: Produktnamn och Pris -->
        <div class="form-row two-cols">
          <div class="form-group">
            <label for="name">Produktnamn</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div class="form-group">
            <label for="price">Pris</label>
            <input type="number" id="price" name="price" min="0.01" step="any" required>
          </div>
        </div>

        <!-- Rad 2: SKU -->
        <div class="form-group">
          <label for="sku">SKU</label>
          <input type="text" id="sku" name="sku" required>
        </div>

        <!-- Rad 3: Beskrivning -->
        <div class="form-group">
          <label for="description">Beskrivning</label>
          <textarea id="description" name="description" rows="4" required></textarea>
        </div>

        <!-- Knapp: Lägg till produkt -->
        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn-submit">Lägg till produkt</button>
        </div>

      </form>

      <!-- Tabell över produkter -->
      <table class="product-table">
        <thead>
          <tr>
            <th>Produkt</th>
            <th>SKU</th>
            <th>Pris</th>
            <th class="th-action"></th>
          </tr>
        </thead>
        <tbody id="product-tbody">
          <!-- Rader hämtas automatiskt via fetch() och läggs till här dynamiskt -->
        </tbody>
      </table>

    </main>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
